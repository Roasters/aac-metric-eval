[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aac-metric-eval"
version = "1.0.0"
description = "Controlled perturbation battery for automated audio-caption metrics"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "aac-metrics==0.5.5",
  "nltk>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "sentence-transformers>=2.2",
  "torch>=2.0",
  "tqdm>=4.65",
  "transformers>=4.41,<5",
]

[project.urls]
Repository = "https://github.com/Roasters/aac-metric-eval"

[tool.setuptools.packages.find]
include = ["eval_battery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
